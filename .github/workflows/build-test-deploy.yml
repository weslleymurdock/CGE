name: Build | Test | Deploy

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    types: ["opened", "synchronize", "reopened"]

  workflow_dispatch:

jobs:
  build:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CGE.slnx -c Release

      - name: Test
        run: dotnet test CGE.slnx -c Release --no-build

      - name: Validate generated API documentation
        shell: bash
        run: |
          test -f site/CGE.github.io/wwwroot/api/CardGameEngine.xml
          grep -q '<version>1.0.0</version>' site/CGE.github.io/wwwroot/api/CardGameEngine.xml
          test "$(grep -c '<member name=' site/CGE.github.io/wwwroot/api/CardGameEngine.xml)" -gt 0
